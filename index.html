<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>শ্যামাসঙ্গীত ও ভক্তিমূলক গীতি সংকলন</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Galada&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #8b1e0f;
      --primary-light: #fbeee9;
      --tag-raag: #7c2d12;
      --tag-raag-bg: #ffedd5;
      --tag-taal: #1e3a8a;
      --tag-taal-bg: #dbeafe;
      --bg: #f8f6f0;
      --card-bg: #ffffff;
      --text: #2a2220;
      --text-muted: #6b5e59;
      --border: #e6dfd5;
      --sidebar-width: 310px;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Serif Bengali', serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      line-height: 1.8;
      overflow-x: hidden;
    }

    /* Sidebar Drawer Styles */
    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--card-bg);
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.25rem 1rem;
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.85rem;
    }

    .sidebar-header h2 {
      font-size: 1.25rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .song-counter {
      font-size: 0.8rem;
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    #sidebar-search {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      margin-top: 0.6rem;
    }

    #sidebar-search:focus {
      border-color: var(--primary);
    }

    #nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      overflow-y: auto;
      padding-right: 0.2rem;
    }

    #nav-list li a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.9rem;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }

    #nav-list li a:hover, #nav-list li a.active {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Hero Banner */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 240px;
      background-image: linear-gradient(to bottom, rgba(42, 34, 32, 0.45), rgba(42, 34, 32, 0.85)), 
                        url('https://lh3.googleusercontent.com/d/1PnxPOsp203TFVu1aBXjKFHh7p21CI8Ng');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 1.5rem 1rem;
    }

    .hero-banner h1 {
      font-family: 'Galada', cursive, 'Noto Serif Bengali', serif;
      font-size: 2.5rem;
      margin-bottom: 0.2rem;
    }

    .hero-banner p {
      font-size: 1rem;
      opacity: 0.92;
      max-width: 600px;
    }

    /* Controls Toolbar */
    .controls-bar {
      max-width: 900px;
      width: 92%;
      margin: -1.5rem auto 1.75rem auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
    }

    .filter-select {
      padding: 0.45rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      background-color: #fff;
      color: var(--text);
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      text-decoration: underline;
    }

    /* Songs Area */
    .content-area {
      max-width: 900px;
      width: 92%;
      margin: 0 auto;
      padding-bottom: 5rem;
    }

    .song-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.8rem 2rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow);
      scroll-margin-top: 1.5rem;
    }

    .song-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.65rem;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 1.15rem;
    }

    .song-title {
      font-size: 1.35rem;
      color: var(--primary);
      font-weight: 700;
      line-height: 1.4;
    }

    .song-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .tag {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 14px;
      cursor: pointer;
      user-select: none;
    }

    .tag-raag { background-color: var(--tag-raag-bg); color: var(--tag-raag); border: 1px solid #fed7aa; }
    .tag-taal { background-color: var(--tag-taal-bg); color: var(--tag-taal); border: 1px solid #bfdbfe; }
    .tag-composer { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }

    .lyrics {
      white-space: pre-line;
      font-size: 1.12rem;
      line-height: 2.1;
      color: #2b221f;
      padding-left: 0.2rem;
      word-break: break-word;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.25rem;
      padding-top: 0.65rem;
      border-top: 1px solid #f6f2ec;
    }

    .top-link {
      font-size: 0.85rem;
      text-decoration: none;
      color: var(--text-muted);
    }

    /* Mobile Floating Index Trigger & Overlay */
    #mobile-menu-btn {
      display: none;
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 30px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 1000;
    }

    #sidebar-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
    }

    /* Responsive Queries */
    @media (max-width: 860px) {
      body { display: block; }

      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: 82%;
        max-width: 320px;
        height: 100vh;
        box-shadow: 2px 0 16px rgba(0,0,0,0.25);
        transform: translateX(-105%);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar-backdrop.active {
        display: block;
      }

      #mobile-menu-btn {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .hero-banner {
        height: 190px;
      }
      .hero-banner h1 {
        font-size: 2rem;
      }

      .controls-bar {
        margin-top: 1rem;
        padding: 1rem;
      }

      .song-card {
        padding: 1.25rem 1.2rem;
      }

      .song-title {
        font-size: 1.2rem;
      }

      .lyrics {
        font-size: 1.05rem;
        line-height: 1.95;
      }
    }
  </style>
</head>
<body>

  <div id="sidebar-backdrop" onclick="toggleMobileSidebar()"></div>

  <button id="mobile-menu-btn" onclick="toggleMobileSidebar()">
    ☰ সূচিপত্র
  </button>

  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>পদাবলী সূচী <span id="song-count" class="song-counter">০টি</span></h2>
      <input type="text" id="sidebar-search" placeholder="গীতি খুঁজুন..." oninput="handleSearch(this.value)">
    </div>
    <ul id="nav-list"></ul>
  </aside>

  <main>
    <header class="hero-banner">
      <h1>শ্যামাসঙ্গীত সংকলন</h1>
      <p>শাস্ত্রীয় রাগ, তাল ও ভাবাশ্রিত ভক্তিমূলক পদাবলীর ডিজিটাল সংগ্রহাগার</p>
    </header>

    <section class="controls-bar">
      <div class="filter-group">
        <label for="raag-filter">রাগ:</label>
        <select id="raag-filter" class="filter-select" onchange="filterByDropdown()">
          <option value="">সকল রাগ</option>
        </select>

        <label for="taal-filter">তাল:</label>
        <select id="taal-filter" class="filter-select" onchange="filterByDropdown()">
          <option value="">সকল তাল</option>
        </select>
      </div>

      <button class="reset-btn" onclick="resetFilters()">সব দেখান</button>
    </section>

    <section class="content-area" id="song-container"></section>
  </main>

  <script>
    const songs = [
  {
    "id": "song-1",
    "title": "(এমা) কালভয় বারিণী কপালিনী কালরূপিণী",
    "raag": "দেশ",
    "taal": "তেওরা",
    "composer": "প্রচলিত",
    "lyrics": "(এমা) কালভয় বারিণী কপালিনী কালরূপিণী\nশম্ভুভামিনী, নিশুম্ভঘাতিনী, সমরবাসিনী সুরবন্দিনী ।।\nপুর-হর-মনোমোহকারিণী, সত্যবাদিনী;\nতন্ত্রদায়িনী, ত্রাস-নাশিনী, ত্রাণকারিণী, তিমির-বরণী ।।\nত্রিগুণধারিণী, ত্রিদেবজননী, ত্রিলোকেশী, তেজরূপিণী,\nঅন্নদায়িনী, অমরপালিনী, অসুরদলনী, আদিকারিণী,\nআশুতোষ-হৃদিবিলাসিনী, আত্মরূপিণী ।।"
  },
  {
    "id": "song-2",
    "title": "অন্তরে জাগিছ গো মা",
    "raag": "সুরট-মল্লার",
    "taal": "ঝাঁপতাল",
    "composer": "প্রচলিত",
    "lyrics": "অন্তরে জাগিছ গো মা, অন্তরযামিনী,\nকোলে করে আছ মোরে, দিবস-যামিনী ।।\nঅধম সুতের প্রতি কেন এত স্নেহপ্রীতি,\nপ্রেমে আহা একেবারে যেন পাগলিনী ।।\nকখনো আদর করি, কখনো সবলে ধরি,\nপিয়াও অমৃত শুনাও মধুর কাহিনী;\nনিরবধি অবিচারে, কত ভালোবাস মোরে,\nউদ্ধারিছ বারে বারে পতিতোদ্ধারিনি ।।\nবুঝেছি এবার সার, মা আমার আমি মার,\nচলিব সুপথে সদা শুনি তব বাণী;\nকরি মাতৃস্তন্য পান, হব বীর বলবান,\nআনন্দে গাইব তব ব্রহ্মসনাতনী ।।"
  },
  {
    "id": "song-3",
    "title": "অভয়-পদে প্রাণ সঁপেছি",
    "raag": "গৌড়সারঙ্গ",
    "taal": "ঝাঁপতাল",
    "composer": "রামপ্রসাদ",
    "lyrics": "অভয়-পদে প্রাণ সঁপেছি ।\nআমি আর কি যমের ভয় রেখেছি ।।\nকালী নাম কল্পতরু, হৃদয়ে রোপণ করেছি ।\nএ দেহ বেচে ভবের হাটে দুর্গানাম কিনে এনেছি ।।\nদেহের মধ্যে সুজন যে জন তাঁর ঘরেতে ঘর করেছি ।\nএবার শমন এলে হৃদয় খুলে দেখাব ভেবে রেখেছি ।।\nসারাৎসার তারা নাম আপন শিখাগ্রে রেখেছি ।\nরামপ্রসাদ বলে দুর্গা ব’লে, যাত্রা করে বসে আছি ।।"
  },
  {
    "id": "song-4",
    "title": "অভয়ার অভয়পদ কর মন সার",
    "raag": "গৌড়সারঙ্গ",
    "taal": "ঝাঁপতাল",
    "composer": "প্রচলিত",
    "lyrics": "অভয়ার অভয়পদ কর মন সার,\nভবভয় সব দূরে যাবে রে তোমার ।।\nঅকর্মজনিত ভয় যদি ভোগাধীন হয়,\nভয়হরা তারা নামে পাইবে নিস্তার ।।\nভ্রান্তিযুক্ত শ্রান্তিহীন, হেলায় হারালে দিন,\nএখনো কর বিধান মনরে আমার;\nআদিভূতা সনাতনী চরণ কররে ধ্যান,\nনা হইও অকিঞ্চন আকিঞ্চনে বদ্ধ আর ।।"
  },
  {
    "id": "song-5",
    "title": "আমরা মায়ের ছেলে, আমরা মায়ের ছেলে",
    "raag": "ইমন-কল্যাণ",
    "taal": "খেমটা",
    "composer": "প্রচলিত",
    "lyrics": "আমরা মায়ের ছেলে, আমরা মায়ের ছেলে।\nআমরা কি কম, আসুক না যম, জিনব অবহেলে ।।\nপথের’পরে বিপদ এলে, দলতে পারি পদতলে।\n(মোদের) হুঙ্কারেতে সাগর শুকায়, পাহাড় পড়ে ট’লে ।।\nচন্দ্র সূর্য গ্রহতারা, মায়ের কথায় ঘুরছে তারা।\nএমন মায়ের ছেলে মোরা দুর্বল কে বলে ।।\nমোদের আবার পাপ কোথায়, স্বর্গ নরক কে বল চায়?\nকাজ ফুরালে সন্ধ্যাবেলায় মা করিবে কোলে ।।"
  },
  {
    "id": "song-6",
    "title": "আমার মা ত্বং হি তারা",
    "raag": "ভৈরবী",
    "taal": "একতাল",
    "composer": "প্রচলিত",
    "lyrics": "আমার মা ত্বং হি তারা, তুমি ত্রিগুণধরা পরাৎপরা ।\nআমি জানি মা ও দীনদয়াময়ী, তুমি দুর্গমেতে দুখহরা ।।\nতুমি জলে তুমি স্থলে, তুমি আদিমূলে গো মা,\nআছ সর্বঘটে অক্ষপুটে, সাকার আকার নিরাকারা ।।\nতুমি সন্ধ্যা তুমি গায়ত্রী, তুমি জগদ্ধাত্রী গো মা,\nতুমি অকূলের ত্রাণকর্ত্রী, সদা শিবের মনোহরা ।।"
  },
  {
    "id": "song-7",
    "title": "আমার মাকে কি দেখেছিস্ তোরা",
    "raag": "জংলা",
    "taal": "দাদরা",
    "composer": "প্রচলিত",
    "lyrics": "আমার মাকে কি দেখেছিস্ তোরা বল্ সত্যি ক'রে ।\nমায়ের নব নব নবরূপে ভুবন মন হরে ।।\nমা তো আমার নয় রে কল্পনা ঐ দেখ্ চিন্ময়ী হাস্যবদনা,\nমায়ের স্নেহ-চক্ষে প্রেমবক্ষে অমিয় ঝরে ।।\nহাসিমুখে করে ভুবন আলো, মায়ের কোলে শোভে ভক্তদল,\nমায়ের প্রসারিত প্রেমবাহু আমাদের তরে ।।\nআয় রে আয় ও জগৎবাসী, তোরা দেখে যা একবার আসি,\nমোদের জননীর ও রূপরাশি পরাণ ভরে ।\n(ও রূপ) যে দেখেছে সেই মজেছে জনমের তরে ।।"
  },
  {
    "id": "song-8",
    "title": "আর কিছু নাই সংসারের মাঝে",
    "raag": "ছায়ানট",
    "taal": "কাওয়ালী",
