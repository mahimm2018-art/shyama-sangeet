<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>শ্যামাসঙ্গীত সংকলন</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Galada&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
  :root {
    --primary: #8b1e0f;
    --primary-light: #fbeee9;
    --accent: #b33927;
    --tag-raag: #7c2d12;
    --tag-raag-bg: #ffedd5;
    --tag-taal: #1e3a8a;
    --tag-taal-bg: #dbeafe;
    --bg: #f8f6f0;
    --card-bg: #ffffff;
    --text: #2a2220;
    --text-muted: #6b5e59;
    --border: #e6dfd5;
    --sidebar-width: 310px;
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Noto Serif Bengali', serif;
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    line-height: 1.8;
    overflow-x: hidden;
  }

  /* =========================================
     Sidebar & Navigation (Desktop & Mobile)
     ========================================= */
  #sidebar {
    width: var(--sidebar-width);
    background-color: var(--card-bg);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 1.25rem 1rem;
    overflow-y: auto;
    z-index: 100;
    transition: transform 0.3s ease;
  }

  .sidebar-header {
    padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.85rem;
  }

  .sidebar-header h2 {
    font-size: 1.25rem;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .song-counter {
    font-size: 0.8rem;
    background: var(--primary-light);
    color: var(--primary);
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
  }

  #sidebar-search {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
    outline: none;
    margin-top: 0.6rem;
    transition: border-color 0.2s;
  }

  #sidebar-search:focus {
    border-color: var(--primary);
  }

  #nav-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    overflow-y: auto;
    padding-right: 0.2rem;
  }

  #nav-list li a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    padding: 0.5rem 0.65rem;
    border-radius: 6px;
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.2s ease;
  }

  #nav-list li a:hover {
    background-color: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
  }

  /* Backdrop for mobile drawer */
  #sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 90;
  }

  /* =========================================
     Main Layout & Hero Banner
     ========================================= */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* Hero Banner - Adjusted for Face Visibility */
  .hero-banner {
    position: relative;
    width: 100%;
    height: 320px; /* Increased height for vertical room */
    background-image: linear-gradient(
      to bottom, 
      rgba(42, 34, 32, 0.15) 0%, 
      rgba(42, 34, 32, 0.35) 45%, 
      rgba(42, 34, 32, 0.88) 100%
    ), 
    url('https://lh3.googleusercontent.com/d/1WDQK9n7bl679M0T9twS6FNTG_n2AiNNH');
    background-size: cover;
    background-position: center 25%; /* Anchors the crop on Maa's face */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end; /* Pushes text downward below the face */
    color: #ffffff;
    text-align: center;
    padding: 1.5rem 1rem 2.2rem 1rem; /* Extra padding at bottom */
  }

  .hero-banner h1 {
    font-family: 'Galada', cursive, 'Noto Serif Bengali', serif;
    font-size: 2.4rem;
    margin-bottom: 0.25rem;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
  }

  .hero-banner p {
    font-size: 0.95rem;
    opacity: 0.95;
    max-width: 600px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  }

  /* =========================================
     Filter Toolbar Controls
     ========================================= */
  .controls-bar {
    max-width: 900px;
    width: 92%;
    margin: -1.5rem auto 1.75rem auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    box-shadow: var(--shadow);
    display: flex;
    flex-wrap: wrap;
    gap: 0.85rem;
    align-items: center;
    justify-content: space-between;
    z-index: 5;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    align-items: center;
  }

  .filter-select {
    padding: 0.45rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.9rem;
    background-color: #ffffff;
    color: var(--text);
    outline: none;
  }

  .filter-select:focus {
    border-color: var(--primary);
  }

  .reset-btn {
    background: none;
    border: none;
    color: var(--primary);
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
    text-decoration: underline;
  }

  /* =========================================
     Song Container & Focus Mode Banner
     ========================================= */
  .content-area {
    max-width: 900px;
    width: 92%;
    margin: 0 auto;
    padding-bottom: 5rem;
  }

  .view-all-bar {
    display: none;
    background: var(--primary-light);
    border: 1px solid #f2c7bc;
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    margin-bottom: 1.5rem;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
    color: var(--primary);
  }

  .view-all-btn {
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 0.4rem 0.9rem;
    border-radius: 6px;
    font-family: inherit;
    cursor: pointer;
    font-size: 0.85rem;
    transition: background 0.2s;
  }

  .view-all-btn:hover {
    background: var(--accent);
  }

  /* =========================================
     Song Card & Typography
     ========================================= */
  .song-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.8rem 2rem;
    margin-bottom: 1.75rem;
    box-shadow: var(--shadow);
    scroll-margin-top: 1.5rem;
    transition: box-shadow 0.2s;
  }

  .song-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.65rem;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 0.75rem;
    margin-bottom: 1.15rem;
  }

  .song-title {
    font-size: 1.35rem;
    color: var(--primary);
    font-weight: 700;
    line-height: 1.4;
  }

  .song-meta-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
  }

  .tag {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 14px;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.2s;
  }

  .tag:hover {
    opacity: 0.85;
  }

  .tag-raag {
    background-color: var(--tag-raag-bg);
    color: var(--tag-raag);
    border: 1px solid #fed7aa;
  }

  .tag-taal {
    background-color: var(--tag-taal-bg);
    color: var(--tag-taal);
    border: 1px solid #bfdbfe;
  }

  .tag-composer {
    background-color: #f3e8ff;
    color: #6b21a8;
    border: 1px solid #e9d5ff;
  }

  .lyrics {
    white-space: pre-line;
    font-size: 1.12rem;
    line-height: 2.1;
    color: #2b221f;
    padding-left: 0.2rem;
    word-break: break-word;
  }

  .card-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 1.25rem;
    padding-top: 0.65rem;
    border-top: 1px solid #f6f2ec;
  }

  .nav-action-link {
    font-size: 0.85rem;
    text-decoration: none;
    color: var(--text-muted);
    cursor: pointer;
    transition: color 0.2s;
  }

  .nav-action-link:hover {
    color: var(--primary);
  }

  /* =========================================
     Floating Action Buttons (Home & Mobile TOC)
     ========================================= */
  #floating-home-btn {
    position: fixed;
    bottom: 5rem;
    right: 1.5rem;
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 0.65rem 1.1rem;
    border-radius: 30px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    cursor: pointer;
    z-index: 99;
    opacity: 0;
    visibility: hidden;
    transform: translateY(15px);
    transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
  }

  #floating-home-btn.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  #floating-home-btn:hover {
    background: var(--accent);
  }

  #mobile-menu-btn {
    display: none;
    position: fixed;
    bottom: 1.25rem;
    right: 1.25rem;
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 0.75rem 1.25rem;
    border-radius: 30px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    z-index: 1000;
  }
    
    .tag-composer {
      background-color: #f3e8ff;
      color: #6b21a8;
      border: 1px solid #e9d5ff;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    .tag-composer:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

  /* =========================================
     Responsive Media Queries
     ========================================= */
  @media (max-width: 860px) {
    body {
      display: block;
    }

    #sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 82%;
      max-width: 320px;
      height: 100vh;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.25);
      transform: translateX(-105%);
    }

    #sidebar.open {
      transform: translateX(0);
    }

    #sidebar-backdrop.active {
      display: block;
    }

    #mobile-menu-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    #floating-home-btn {
      bottom: 4.8rem;
      right: 1.25rem;
    }

    .hero-banner {
      height: 260px;
      background-position: center 20%;
      padding-bottom: 1.8rem;
    }

    .hero-banner h1 {
      font-size: 1.85rem;
    }

    .controls-bar {
      margin-top: 1rem;
      padding: 1rem;
    }

    .song-card {
      padding: 1.25rem 1.2rem;
    }

    .song-title {
      font-size: 1.2rem;
    }

    .lyrics {
      font-size: 1.05rem;
      line-height: 1.95;
    }
  }
</style>
</head>
<body>

  <div id="sidebar-backdrop" onclick="toggleMobileSidebar()"></div>

  <button id="mobile-menu-btn" onclick="toggleMobileSidebar()">
    ☰ সূচিপত্র
  </button>

  <aside id="sidebar">
    <div class="sidebar-header">
      <h2> সূচী <span id="song-count" class="song-counter">০টি</span></h2>
      <input type="text" id="sidebar-search" placeholder="শ্যামাসঙ্গীত খুঁজুন..." oninput="handleSearch(this.value)">
    </div>
    <ul id="nav-list"></ul>
  </aside>

  <main>
    <header class="hero-banner">
      <h1>শ্যামাসঙ্গীত সংকলন</h1>
    </header>

    <section class="controls-bar">
      <div class="filter-group">
        <label for="raag-filter">রাগ:</label>
        <select id="raag-filter" class="filter-select" onchange="filterByDropdown()">
          <option value="">সকল রাগ</option>
        </select>

        <label for="taal-filter">তাল:</label>
        <select id="taal-filter" class="filter-select" onchange="filterByDropdown()">
          <option value="">সকল তাল</option>
        </select>

        <!-- নতুন রচয়িতা ফিল্টার -->
        <label for="composer-filter">রচয়িতা:</label>
        <select id="composer-filter" class="filter-select" onchange="filterByDropdown()">
          <option value="">সকল রচয়িতা</option>
        </select>
      </div>

      <button class="reset-btn" onclick="resetFilters()">রিসেট অল ফিল্টারস</button>
    </section>

    <section class="content-area" id="song-container"></section>
  </main>

  <script>
    const songs = [
  {
    "id": "song-1",
    "title": "(এমা) কালভয় বারিণী কপালিনী কালরূপিণী",
    "raag": "দেশ",
    "taal": "তেওরা",
    "composer": "প্রচলিত",
    "lyrics": "(এমা) কালভয় বারিণী কপালিনী কালরূপিণী\nশম্ভুভামিনী, নিশুম্ভঘাতিনী, সমরবাসিনী সুরবন্দিনী ।।\nপুর-হর-মনোমোহকারিণী, সত্যবাদিনী;\nতন্ত্রদায়িনী, ত্রাস-নাশিনী, ত্রাণকারিণী, তিমির-বরণী ।।\nত্রিগুণধারিণী, ত্রিদেবজননী, ত্রিলোকেশী, তেজরূপিণী,\nঅন্নদায়িনী, অমরপালিনী, অসুরদলনী, আদিকারিণী,\nআশুতোষ-হৃদিবিলাসিনী, আত্মরূপিণী ।।"
  },
  {
    "id": "song-2",
    "title": "অন্তরে জাগিছ গো মা",
    "raag": "সুরট-মল্লার",
    "taal": "ঝাঁপতাল",
    "composer": "প্রচলিত",
    "lyrics": "অন্তরে জাগিছ গো মা, অন্তরযামিনী,\nকোলে করে আছ মোরে, দিবস-যামিনী ।।\nঅধম সুতের প্রতি কেন এত স্নেহপ্রীতি,\nপ্রেমে আহা একেবারে যেন পাগলিনী ।।\nকখনো আদর করি, কখনো সবলে ধরি,\nপিয়াও অমৃত শুনাও মধুর কাহিনী;\nনিরবধি অবিচারে, কত ভালোবাস মোরে,\nউদ্ধারিছ বারে বারে পতিতোদ্ধারিনি ।।\nবুঝেছি এবার সার, মা আমার আমি মার,\nচলিব সুপথে সদা শুনি তব বাণী;\nকরি মাতৃস্তন্য পান, হব বীর বলবান,\nআনন্দে গাইব তব ব্রহ্মসনাতনী ।।"
  },
  {
    "id": "song-3",
    "title": "অভয়-পদে প্রাণ সঁপেছি",
    "raag": "গৌড়সারঙ্গ",
    "taal": "ঝাঁপতাল",
    "composer": "রামপ্রসাদ",
    "lyrics": "অভয়-পদে প্রাণ সঁপেছি ।\nআমি আর কি যমের ভয় রেখেছি ।।\nকালী নাম কল্পতরু, হৃদয়ে রোপণ করেছি ।\nএ দেহ বেচে ভবের হাটে দুর্গানাম কিনে এনেছি ।।\nদেহের মধ্যে সুজন যে জন তাঁর ঘরেতে ঘর করেছি ।\nএবার শমন এলে হৃদয় খুলে দেখাব ভেবে রেখেছি ।।\nসারাৎসার তারা নাম আপন শিখাগ্রে রেখেছি ।\nরামপ্রসাদ বলে দুর্গা ব’লে, যাত্রা করে বসে আছি ।।"
  },
  {
    "id": "song-4",
    "title": "অভয়ার অভয়পদ কর মন সার",
    "raag": "গৌড়সারঙ্গ",
    "taal": "ঝাঁপতাল",
    "composer": "প্রচলিত",
    "lyrics": "অভয়ার অভয়পদ কর মন সার,\nভবভয় সব দূরে যাবে রে তোমার ।।\nঅকর্মজনিত ভয় যদি ভোগাধীন হয়,\nভয়হরা তারা নামে পাইবে নিস্তার ।।\nভ্রান্তিযুক্ত শ্রান্তিহীন, হেলায় হারালে দিন,\nএখনো কর বিধান মনরে আমার;\nআদিভূতা সনাতনী চরণ কররে ধ্যান,\nনা হইও অকিঞ্চন আকিঞ্চনে বদ্ধ আর ।।"
  },
  {
    "id": "song-5",
    "title": "আমরা মায়ের ছেলে, আমরা মায়ের ছেলে",
    "raag": "ইমন-কল্যাণ",
    "taal": "খেমটা",
    "composer": "প্রচলিত",
    "lyrics": "আমরা মায়ের ছেলে, আমরা মায়ের ছেলে।\nআমরা কি কম, আসুক না যম, জিনব অবহেলে ।।\nপথের’পরে বিপদ এলে, দলতে পারি পদতলে।\n(মোদের) হুঙ্কারেতে সাগর শুকায়, পাহাড় পড়ে ট’লে ।।\nচন্দ্র সূর্য গ্রহতারা, মায়ের কথায় ঘুরছে তারা।\nএমন মায়ের ছেলে মোরা দুর্বল কে বলে ।।\nমোদের আবার পাপ কোথায়, স্বর্গ নরক কে বল চায়?\nকাজ ফুরালে সন্ধ্যাবেলায় মা করিবে কোলে ।।"
  },
  {
    "id": "song-6",
    "title": "আমার মা ত্বং হি তারা",
    "raag": "ভৈরবী",

// ============================================================================
// 1. DATA SOURCE
// Keep your existing array of songs here:
// const songs = [ ... ];
// ============================================================================

// State Management
// স্টেট ম্যানেজমেন্টে composer যোগ করা হয়েছে
let currentFilter = {
  raag: "",
  taal: "",
  composer: "",
  sidebarSearch: "",
  selectedSongId: null
};

function initPage() {
  ensureFloatingHomeButton();
  populateDropdowns();
  renderSidebar();
  renderApp();
  setupScrollListener();
}

function ensureFloatingHomeButton() {
  if (!document.getElementById("floating-home-btn")) {
    const btn = document.createElement("button");
    btn.id = "floating-home-btn";
    btn.innerHTML = "⌂ হোম (উপরে যান)";
    btn.onclick = scrollToTop;
    document.body.appendChild(btn);
  }
}

function toggleMobileSidebar() {
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("sidebar-backdrop");
  if (sidebar && backdrop) {
    const isOpen = sidebar.classList.toggle("open");
    backdrop.classList.toggle("active", isOpen);
  }
}

// রাগ, তাল এবং রচয়িতার ড্রপডাউন তৈরি
function populateDropdowns() {
  const raagSelect = document.getElementById("raag-filter");
  const taalSelect = document.getElementById("taal-filter");
  const composerSelect = document.getElementById("composer-filter");

  if (!raagSelect || !taalSelect || !composerSelect) return;

  const raags = [...new Set(songs.map(s => s.raag).filter(r => r && r !== "অনির্দিষ্ট"))].sort();
  const taals = [...new Set(songs.map(s => s.taal).filter(t => t && t !== "অনির্দিষ্ট"))].sort();
  const composers = [...new Set(songs.map(s => s.composer).filter(c => c))].sort();

  raags.forEach(r => raagSelect.innerHTML += `<option value="${r}">${r}</option>`);
  taals.forEach(t => taalSelect.innerHTML += `<option value="${t}">${t}</option>`);
  composers.forEach(c => composerSelect.innerHTML += `<option value="${c}">${c}</option>`);
}

function setupScrollListener() {
  window.addEventListener("scroll", () => {
    const homeBtn = document.getElementById("floating-home-btn");
    if (!homeBtn) return;

    const isSingleSongActive = Boolean(currentFilter.selectedSongId);
    const hasScrolledDown = window.scrollY > 320;

    if (!isSingleSongActive && hasScrolledDown) {
      homeBtn.classList.add("visible");
    } else {
      homeBtn.classList.remove("visible");
    }
  });
}

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderSidebar(query = "") {
  const navList = document.getElementById("nav-list");
  if (!navList) return;

  navList.innerHTML = "";
  const q = query.toLowerCase().trim();

  const matchedSongs = songs.filter(song => {
    return !q || song.title.toLowerCase().includes(q) || song.raag.toLowerCase().includes(q) || song.composer.toLowerCase().includes(q);
  });

  matchedSongs.forEach(song => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "javascript:void(0)";
    a.innerText = song.title;
    a.onclick = () => {
      selectSingleSong(song.id);
      if (window.innerWidth <= 860) toggleMobileSidebar();
    };
    li.appendChild(a);
    navList.appendChild(li);
  });
}

function selectSingleSong(songId) {
  currentFilter.selectedSongId = songId;
  renderApp();

  const homeBtn = document.getElementById("floating-home-btn");
  if (homeBtn) homeBtn.classList.remove("visible");

  const target = document.getElementById(songId);
  if (target) {
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function showAllSongs() {
  currentFilter.selectedSongId = null;
  renderApp();
}

function renderApp() {
  const container = document.getElementById("song-container");
  if (!container) return;
  container.innerHTML = "";

  if (currentFilter.selectedSongId) {
    const banner = document.createElement("div");
    banner.className = "view-all-bar";
    banner.style.display = "flex";
    banner.innerHTML = `
      <span>একটি নির্বাচিত গীতি প্রদর্শিত হচ্ছে</span>
      <button class="view-all-btn" onclick="showAllSongs()">সকল গীতি প্রদর্শন করুন</button>
    `;
    container.appendChild(banner);
  }

  // রাগ, তাল ও রচয়িতা ফিল্টারিং শর্ত
  const filtered = songs.filter(song => {
    if (currentFilter.selectedSongId) {
      return song.id === currentFilter.selectedSongId;
    }
    const matchesRaag = !currentFilter.raag || song.raag === currentFilter.raag;
    const matchesTaal = !currentFilter.taal || song.taal === currentFilter.taal;
    const matchesComposer = !currentFilter.composer || song.composer === currentFilter.composer;
    return matchesRaag && matchesTaal && matchesComposer;
  });

  const counterElem = document.getElementById("song-count");
  if (counterElem) {
    counterElem.innerText = `${currentFilter.selectedSongId ? 1 : filtered.length}টি গান`;
  }

  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:3rem; color:var(--text-muted);">কোনো পদ পাওয়া যায়নি।</div>`;
    return;
  }

  filtered.forEach(song => {
    const card = document.createElement("article");
    card.className = "song-card";
    card.id = song.id;
    card.innerHTML = `
      <div class="song-header">
        <h3 class="song-title">${song.title}</h3>
        <div class="song-meta-tags">
          <span class="tag tag-raag" onclick="filterByTag('raag', '${song.raag}')" title="রাগে ফিল্টার করুন">রাগ: ${song.raag}</span>
          <span class="tag tag-taal" onclick="filterByTag('taal', '${song.taal}')" title="তালে ফিল্টার করুন">তাল: ${song.taal}</span>
          <span class="tag tag-composer" onclick="filterByTag('composer', '${song.composer}')" title="রচয়িতায় ফিল্টার করুন">${song.composer}</span>
        </div>
      </div>
      <div class="lyrics">${song.lyrics}</div>
      <div class="card-footer">
        <a href="javascript:void(0)" class="nav-action-link" onclick="handleIndexReturn()">↑ সূচিপত্রে ফিরে যান</a>
      </div>
    `;
    container.appendChild(card);
  });
}

function handleIndexReturn() {
  if (window.innerWidth <= 860) {
    toggleMobileSidebar();
  } else {
    const searchInput = document.getElementById("sidebar-search");
    if (searchInput) searchInput.focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

// ট্যাগ ক্লিকের ফিল্টার হ্যান্ডলার (raag, taal, composer)
function filterByTag(type, value) {
  currentFilter.selectedSongId = null;
  if (type === "raag") {
    currentFilter.raag = value;
    const raagSelect = document.getElementById("raag-filter");
    if (raagSelect) raagSelect.value = value;
  } else if (type === "taal") {
    currentFilter.taal = value;
    const taalSelect = document.getElementById("taal-filter");
    if (taalSelect) taalSelect.value = value;
  } else if (type === "composer") {
    currentFilter.composer = value;
    const composerSelect = document.getElementById("composer-filter");
    if (composerSelect) composerSelect.value = value;
  }
  renderApp();
  scrollToTop();
}

// ড্রপডাউন পরিবর্তনের ফিল্টার হ্যান্ডলার
function filterByDropdown() {
  currentFilter.selectedSongId = null;
  const raagSelect = document.getElementById("raag-filter");
  const taalSelect = document.getElementById("taal-filter");
  const composerSelect = document.getElementById("composer-filter");

  currentFilter.raag = raagSelect ? raagSelect.value : "";
  currentFilter.taal = taalSelect ? taalSelect.value : "";
  currentFilter.composer = composerSelect ? composerSelect.value : "";
  renderApp();
}

function handleSearch(val) {
  renderSidebar(val);
}

// ফিল্টার রিসেট
function resetFilters() {
  currentFilter = { raag: "", taal: "", composer: "", sidebarSearch: "", selectedSongId: null };
  const raagSelect = document.getElementById("raag-filter");
  const taalSelect = document.getElementById("taal-filter");
  const composerSelect = document.getElementById("composer-filter");
  const searchInput = document.getElementById("sidebar-search");

  if (raagSelect) raagSelect.value = "";
  if (taalSelect) taalSelect.value = "";
  if (composerSelect) composerSelect.value = "";
  if (searchInput) searchInput.value = "";

  renderSidebar();
  renderApp();
}

window.onload = initPage;
  </script>
