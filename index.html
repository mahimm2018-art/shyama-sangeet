<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শ্যামাসঙ্গীত ও ভক্তিমূলক গীতি সংকলন</title>
  
  <!-- Bengali Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Galada&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #8b1e0f;
      --primary-light: #fbeee9;
      --accent: #b33927;
      --tag-raag: #7c2d12;
      --tag-raag-bg: #ffedd5;
      --tag-taal: #1e3a8a;
      --tag-taal-bg: #dbeafe;
      --bg: #f8f6f0;
      --card-bg: #ffffff;
      --text: #2a2220;
      --text-muted: #6b5e59;
      --border: #e6dfd5;
      --sidebar-width: 320px;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Serif Bengali', serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      line-height: 1.8;
    }

    /* Sidebar Navigation */
    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--card-bg);
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      overflow-y: auto;
      z-index: 10;
    }

    .sidebar-header {
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .sidebar-header h2 {
      font-size: 1.35rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .song-counter {
      font-size: 0.85rem;
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    #sidebar-search {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      margin-top: 0.75rem;
      transition: border-color 0.2s;
    }

    #sidebar-search:focus {
      border-color: var(--primary);
    }

    #nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      overflow-y: auto;
    }

    #nav-list li a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.92rem;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }

    #nav-list li a:hover {
      background-color: var(--primary-light);
      color: var(--primary);
      padding-left: 0.85rem;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Hero Banner */
    .hero-banner {
      position: relative;
      width: 100%;
      height: 280px;
      background-image: linear-gradient(to bottom, rgba(42, 34, 32, 0.45), rgba(42, 34, 32, 0.85)), 
                        url('https://lh3.googleusercontent.com/d/1PnxPOsp203TFVu1aBXjKFHh7p21CI8Ng');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 1.5rem;
    }

    .hero-banner h1 {
      font-family: 'Galada', cursive, 'Noto Serif Bengali', serif;
      font-size: 2.8rem;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      margin-bottom: 0.25rem;
    }

    .hero-banner p {
      font-size: 1.15rem;
      opacity: 0.92;
      max-width: 650px;
    }

    /* Filter & Controls Toolbar */
    .controls-bar {
      max-width: 950px;
      width: 92%;
      margin: -1.75rem auto 2rem auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.75rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 5;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .filter-select {
      padding: 0.5rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      background-color: #fff;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    .filter-select:focus {
      border-color: var(--primary);
    }

    .active-filter-badge {
      display: none;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      background: var(--primary-light);
      color: var(--primary);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-weight: 600;
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      text-decoration: underline;
    }

    /* Content Area */
    .content-area {
      max-width: 950px;
      width: 92%;
      margin: 0 auto;
      padding-bottom: 4rem;
    }

    /* Song Card */
    .song-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2.25rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      scroll-margin-top: 2rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .song-card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .song-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .song-title {
      font-size: 1.45rem;
      color: var(--primary);
      font-weight: 700;
    }

    .song-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 16px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      user-select: none;
    }

    .tag:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .tag-raag {
      background-color: var(--tag-raag-bg);
      color: var(--tag-raag);
      border: 1px solid #fed7aa;
    }

    .tag-taal {
      background-color: var(--tag-taal-bg);
      color: var(--tag-taal);
      border: 1px solid #bfdbfe;
    }

    .tag-composer {
      background-color: #f3e8ff;
      color: #6b21a8;
      border: 1px solid #e9d5ff;
    }

    .lyrics {
      white-space: pre-line;
      font-size: 1.15rem;
      color: #332a28;
      line-height: 2.1;
      padding-left: 0.5rem;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid #f7f3ee;
    }

    .top-link {
      font-size: 0.85rem;
      text-decoration: none;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .top-link:hover {
      color: var(--primary);
    }

    .no-results {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    /* Responsive */
    @media (max-width: 860px) {
      body {
        flex-direction: column;
      }
      #sidebar {
        width: 100%;
        height: auto;
        max-height: 280px;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .controls-bar {
        margin-top: 1rem;
      }
      .hero-banner {
        height: 220px;
      }
      .hero-banner h1 {
        font-size: 2.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>পদাবলী সূচী <span id="song-count" class="song-counter">০টি</span></h2>
      <input type="text" id="sidebar-search" placeholder="গীতি বা পদ খুঁজুন..." oninput="handleSearch(this.value)">
    </div>
    <ul id="nav-list"></ul>
  </aside>

  <!-- Main Body -->
  <main>
    <!-- Hero Banner with Drive Image -->
    <header class="hero-banner">
      <h1>শ্যামাসঙ্গীত সংকলন</h1>
      <p>শাস্ত্রীয় রাগ, তাল ও ভাবাশ্রিত ভক্তিমূলক পদাবলীর ডিজিটাল সংগ্রহাগার</p>
    </header>

    <!-- Toolbar Filters -->
    <section class="controls-bar">
      <div class="filter-group">
        <label for="raag-filter">রাগ:</label>
        <select id="raag-filter" class="filter-select" onchange="filterByDropdown()">
          <option value="">সকল রাগ</option>
        </select>

        <label for="taal-filter">তাল:</label>
        <select id="taal-filter" class="filter-select" onchange="filterByDropdown()">
          <option value="">সকল তাল</option>
        </select>

        <div id="filter-indicator" class="active-filter-badge">
          <span id="active-filter-text"></span>
          <button class="reset-btn" onclick="resetFilters()">✕ বাতিল</button>
        </div>
      </div>

      <button class="reset-btn" onclick="resetFilters()">সব দেখান</button>
    </section>

    <!-- Song List Container -->
    <section class="content-area" id="song-container"></section>
  </main>

  <script>
    // Repository Data: First 5 Songs (Ready for full 65 song expansion)
    const songs = [
      {
        id: "song-1",
        title: "আশাবাস ঘোর-তমোনাশা বামা কে",
        raag: "বেহাগ",
        taal: "কাওয়ালী",
        composer: "রামপ্রসাদ",
        summary: "দেবী কালিকার রণরঙ্গিণী মোহিনী রূপের বন্দনা এবং সংসারের মোহান্ধকার দূরীকরণে মায়ের অভয়প্রার্থনা।",
        lyricsSample: "আশাবাস ঘোর-তমোনাশা বামা কে (মোহিনী)।\nঘোর ঘটা করিঘটা ব্রহ্মকটা ঠেকেছে।।\nরাপসী শিরসি শশী, হারোরসি এলোকেশী,\nমধ্যস্থলা সুধাচালা কুলবালা নাচিছে।।"
      },
      {
        id: "song-2",
        title: "মা আছেন আর আমি আছি",
        raag: "লগ্নী-খাম্বাজ",
        taal: "কাহারবা",
        composer: "প্রচলিত",
        summary: "মায়ের চিরন্তন আশ্রয়, অকৃত্রিম অপত্য স্নেহ এবং জীবনের সকল সংকট মোচনের গভীর আত্মনিবেদন।",
        lyricsSample: "মা আছেন আর আমি আছি ভাবনা কি আছে আমার।\nমায়ের হাতে খাই পরি, মা নিয়েছেন আমার ভার।।\nসংসার পাকে ঘোর বিপাকে যখন দেখবি অন্ধকার।\nঅন্ধকারের বিপদ হ’তে মা যে করেছেন উদ্ধার।।"
      },
      {
        id: "song-3",
        title: "আমার মাকে কি দেখেছিস্ তোরা",
        raag: "জংলা",
        taal: "দাদরা",
        composer: "প্রচলিত",
        summary: "বিশ্ববাসীকে বিশ্বজননীর চিন্ময়ী হাসিমুখ ও প্রসারিত প্রেমবাহুর অমৃতরূপ দর্শনের আনন্দময় আহ্বান।",
        lyricsSample: "আমার মাকে কি দেখেছিস্ তোরা বল্ সত্যি ক'রে।\nমায়ের নব নব নবরূপে ভুবন মন হরে।।\nমা তো আমার নয় রে কল্পনা ঐ দেখ্ চিন্ময়ী হাস্যবদনা,\nমায়ের স্নেহ-চক্ষে প্রেমবক্ষে অমিয় ঝরে।।"
      },
      {
        id: "song-4",
        title: "আমার মা ত্বং হি তারা",
        raag: "ভৈরবী",
        taal: "একতাল",
        composer: "প্রচলিত",
        summary: "তারামায়ের ত্রিগুণময়ী, পরাৎপরা এবং সর্বভূতে সাকার-নিরাকার ব্যাপ্তির পরম বৈদান্তিক স্তুতি।",
        lyricsSample: "আমার মা ত্বং হি তারা, তুমি ত্রিগুণধরা পরাৎপরা।\nআমি জানি মা ও দীনদয়াময়ী, তুমি দুর্গমেতে দুখহরা।।\nতুমি জলে তুমি স্থলে, তুমি আদিমূলে গো মা,\nআছ সর্বঘটে অঙ্কুটে, সাকার আকার নিরাকারা।।"
      },
      {
        id: "song-5",
        title: "যতনে হৃদয়ে রেখো, আদরিণী শ্যামা মাকে",
        raag: "কাংড়ালে",
        taal: "ঝাঁপতাল",
        composer: "কমলাকান্ত",
        summary: "কামাদি রিপুদের ফাঁকি দিয়ে হৃদয়ের নিভৃতে পরম রত্নস্বরূপা শ্যামা মাকে পরম যত্নে আগলে রাখার সাধনাগীত।",
        lyricsSample: "যতনে হৃদয়ে রেখো, আদরিণী শ্যামা মাকে।\nমন তুই দেখ্ আর আমি দেখি, আর যেন কেউ নাহি দেখে।।\nকামাদিরে দিয়ে ফাঁকি, আয় মন বিরলে দেখি\nরসনারে সঙ্গে রাখি, সে যেন মা ব'লে ডাকে।।"
      }
    ];

    let currentFilter = { raag: "", taal: "", search: "" };

    function initPage() {
      populateDropdowns();
      renderApp();
    }

    function populateDropdowns() {
      const raags = [...new Set(songs.map(s => s.raag))].sort();
      const taals = [...new Set(songs.map(s => s.taal))].sort();

      const raagSelect = document.getElementById("raag-filter");
      const taalSelect = document.getElementById("taal-filter");

      raags.forEach(r => raagSelect.innerHTML += `<option value="${r}">${r}</option>`);
      taals.forEach(t => taalSelect.innerHTML += `<option value="${t}">${t}</option>`);
    }

    function renderApp() {
      const container = document.getElementById("song-container");
      const navList = document.getElementById("nav-list");
      container.innerHTML = "";
      navList.innerHTML = "";

      const filtered = songs.filter(song => {
        const matchesRaag = !currentFilter.raag || song.raag === currentFilter.raag;
        const matchesTaal = !currentFilter.taal || song.taal === currentFilter.taal;
        const q = currentFilter.search.toLowerCase();
        const matchesSearch = !q || 
                              song.title.toLowerCase().includes(q) || 
                              song.raag.toLowerCase().includes(q) || 
                              song.taal.toLowerCase().includes(q) || 
                              song.composer.toLowerCase().includes(q) ||
                              song.summary.toLowerCase().includes(q);
        return matchesRaag && matchesTaal && matchesSearch;
      });

      document.getElementById("song-count").innerText = `${filtered.length}টি গান`;

      // Update Active Filter Badge
      const indicator = document.getElementById("filter-indicator");
      const filterText = document.getElementById("active-filter-text");
      if (currentFilter.raag || currentFilter.taal) {
        indicator.style.display = "inline-flex";
        filterText.innerText = [
          currentFilter.raag ? `রাগ: ${currentFilter.raag}` : "",
          currentFilter.taal ? `তাল: ${currentFilter.taal}` : ""
        ].filter(Boolean).join(" | ");
      } else {
        indicator.style.display = "none";
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="no-results">কোনো পদ পাওয়া যায়নি। ফিল্টার পরিবর্তন করুন।</div>`;
        return;
      }

      filtered.forEach((song, idx) => {
        // Nav Item
        const li = document.createElement("li");
        li.innerHTML = `<a href="#${song.id}">${song.title}</a>`;
        navList.appendChild(li);

        // Song Card
        const card = document.createElement("article");
        card.className = "song-card";
        card.id = song.id;
        card.innerHTML = `
          <div class="song-header">
            <h3 class="song-title">${song.title}</h3>
            <div class="song-meta-tags">
              <span class="tag tag-raag" onclick="filterByTag('raag', '${song.raag}')" title="রাগে ফিল্টার করুন">রাগ: ${song.raag}</span>
              <span class="tag tag-taal" onclick="filterByTag('taal', '${song.taal}')" title="তালে ফিল্টার করুন">তাল: ${song.taal}</span>
              <span class="tag tag-composer" title="রচয়িতা">${song.composer}</span>
            </div>
          </div>
          <p style="font-size:0.95rem; color:var(--text-muted); margin-bottom:1rem;"><em>ভাবার্থ:</em> ${song.summary}</p>
          <div class="lyrics">${song.lyricsSample}</div>
          <p style="margin-top:0.8rem; font-size:0.88rem; color:var(--text-muted);">
            সম্পূর্ণ পদটি গুগলে খুঁজে পড়তে পারেন: <em>"${song.title}"</em>
          </p>
          <div class="card-footer">
            <a href="#sidebar" class="top-link">↑ সূচিপত্রে ফিরে যান</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Interactive Tag/Menu Handlers
    function filterByTag(type, value) {
      if (type === 'raag') {
        currentFilter.raag = value;
        document.getElementById("raag-filter").value = value;
      } else if (type === 'taal') {
        currentFilter.taal = value;
        document.getElementById("taal-filter").value = value;
      }
      renderApp();
    }

    function filterByDropdown() {
      currentFilter.raag = document.getElementById("raag-filter").value;
      currentFilter.taal = document.getElementById("taal-filter").value;
      renderApp();
    }

    function handleSearch(val) {
      currentFilter.search = val;
      renderApp();
    }

    function resetFilters() {
      currentFilter = { raag: "", taal: "", search: "" };
      document.getElementById("raag-filter").value = "";
      document.getElementById("taal-filter").value = "";
      document.getElementById("sidebar-search").value = "";
      renderApp();
    }

    window.onload = initPage;
  </script>
</body>
</html>
