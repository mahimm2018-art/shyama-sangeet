<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শ্যামাসঙ্গীত সংকলন</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Galada&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #8b1e0f;
      --primary-light: #fbeee9;
      --tag-raag: #7c2d12;
      --tag-raag-bg: #ffedd5;
      --tag-taal: #1e3a8a;
      --tag-taal-bg: #dbeafe;
      --bg: #f8f6f0;
      --card-bg: #ffffff;
      --text: #2a2220;
      --text-muted: #6b5e59;
      --border: #e6dfd5;
      --sidebar-width: 320px;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Serif Bengali', serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      line-height: 1.8;
    }

    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--card-bg);
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      overflow-y: auto;
      z-index: 10;
    }

    .sidebar-header {
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }

    .sidebar-header h2 {
      font-size: 1.35rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .song-counter {
      font-size: 0.85rem;
      background: var(--primary-light);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    #sidebar-search {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      margin-top: 0.75rem;
    }

    #nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      overflow-y: auto;
    }

    #nav-list li a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.92rem;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s;
    }

    #nav-list li a:hover {
      background-color: var(--primary-light);
      color: var(--primary);
      padding-left: 0.85rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .hero-banner {
      position: relative;
      width: 100%;
      height: 280px;
      background-image: linear-gradient(to bottom, rgba(42, 34, 32, 0.45), rgba(42, 34, 32, 0.85)), 
                        url('https://lh3.googleusercontent.com/d/1PnxPOsp203TFVu1aBXjKFHh7p21CI8Ng');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-align: center;
      padding: 1.5rem;
    }

    .hero-banner h1 {
      font-family: 'Galada', cursive, 'Noto Serif Bengali', serif;
      font-size: 2.8rem;
      margin-bottom: 0.25rem;
    }

    .controls-bar {
      max-width: 950px;
      width: 92%;
      margin: -1.75rem auto 2rem auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.75rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .filter-select {
      padding: 0.5rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      background-color: #fff;
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.9rem;
      font-family: inherit;
      text-decoration: underline;
    }

    .content-area {
      max-width: 950px;
      width: 92%;
      margin: 0 auto;
      padding-bottom: 4rem;
    }

    .song-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2.25rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      scroll-margin-top: 2rem;
    }

    .song-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .song-title {
      font-size: 1.45rem;
      color: var(--primary);
      font-weight: 700;
    }

    .song-meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tag {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
    }

    .tag-raag { background-color: var(--tag-raag-bg); color: var(--tag-raag); border: 1px solid #fed7aa; }
    .tag-taal { background-color: var(--tag-taal-bg); color: var(--tag-taal); border: 1px solid #bfdbfe; }
    .tag-composer { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }

    .lyrics {
      white-space: pre-line;
      font-size: 1.15rem;
      line-height: 2.1;
      padding-left: 0.5rem;
    }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid #f7f3ee;
    }

    .top-link {
      font-size: 0.85rem;
      text-decoration: none;
      color: var(--text-muted);
    }

    @media (max-width: 860px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: auto; max-height: 280px; position: relative; border-right: none; }
      .controls-bar { margin-top: 1rem; }
      .hero-banner { height: 220px; }
      .hero-banner h1 { font-size: 2.1rem; }
    }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>পদাবলী সূচী <span id="song-count" class="song-counter">০টি</span></h2>
      <input type="text" id="sidebar-search" placeholder="গীতি বা পদ খুঁজুন..." oninput="handleSearch(this.value)">
    </div>
    <ul id="nav-list"></ul>
  </aside>

  <main>
    <header class="hero-banner">
      <h1>শ্যামাসঙ্গীত সংকলন</h1>
      <p>শাস্ত্রীয় রাগ, তাল ও ভাবাশ্রিত ভক্তিমূলক পদাবলীর ডিজিটাল সংগ্রহাগার</p>
    </header>

    <section class="controls-bar">
      <div class="filter-group">
        <label for="raag-filter">রাগ:</label>
        <select id="raag-filter" class="filter-select" onchange="filterByDropdown()">
          <option value="">সকল রাগ</option>
        </select>

        <label for="taal-filter">তাল:</label>
        <select id="taal-filter" class="filter-select" onchange="filterByDropdown()">
          <option value="">সকল তাল</option>
        </select>
      </div>

      <button class="reset-btn" onclick="resetFilters()">সব দেখান</button>
    </section>

    <section class="content-area" id="song-container"></section>
  </main>

  <script>
    const songs = [
  {
    "id": "song-1",
    "title": "(এমা) কালভয় বারিণী কপালিনী কালরূপিণী",
    "raag": "দেশ",
    "taal": "তেওরা",
    "composer": "প্রচলিত",
    "lyrics": "(এমা) কালভয় বারিণী কপালিনী কালরূপিণী\nশম্ভুভামিনী, নিশুম্ভঘাতিনী, সমরবাসিনী সুরবন্দিনী ।।\nপুর-হর-মনোমোহকারিণী, সত্যবাদিনী;\nতন্ত্রদায়িনী, ত্রাস-নাশিনী, ত্রাণকারিণী, তিমির-বরণী ।।\nত্রিগুণধারিণী, ত্রিদেবজননী, ত্রিলোকেশী, তেজরূপিণী,\nঅন্নদায়িনী, অমরপালিনী, অসুরদলনী, আদিকারিণী,\nআশুতোষ-হৃদিবিলাসিনী, আত্মরূপিণী ।।\n(এমা) O Mother!\nকালভয় The fear of death/time\nবারিণী The remover\nকপালিনী She who wears a skull garland\nকালরূপিণী She whose form is Time itself\nশম্ভুভামিনী The beloved consort of Shambhu (Shiva)\nনিশুম্ভঘাতিনী The slayer of the demon Nishumbha\nসমরবাসিনী She who dwells in battle\nসুরবন্দিনী She who is worshipped by the Gods\nপুর-হর \"Destroyer of cities\" (an epithet for Shiva)\nমনোমোহকারিণী She who enchants the mind (of Shiva)\nসত্যবাদিনী She who is the embodiment of Truth\nতন্ত্রদায়িনী The giver of the Tantras (divine knowledge)\nত্রাস-নাশিনী The destroyer of terror\nত্রাণকারিণী The saviour; she who grants refuge\nতিমির-বরণী She whose complexion is as dark as the night\nত্রিগুণধারিণী The bearer of the three Gunas\nত্রিদেবজননী The mother of the three great Gods\nত্রিলোকেশী The ruler of the three worlds\nতেজরূপিণী She whose form is pure energy and brilliance\nঅন্নদায়িনী The giver of food\nঅমরপালিনী The protector of the immortals (Gods)\nঅসুরদলনী The crusher of the demons\nআদিকারিণী The primal cause; the original creator\nআশুতোষ \"He who is easily pleased\" (an epithet for Shiva)\nহৃদিবিলাসিনী She who joyfully dwells in the heart (of Shiva)\nআত্মরূপিণী She whose form is the ultimate Self (Atman)"
  },
  {
    "id": "song-2",
    "title": "অন্তরে জাগিছ গো মা",
    "raag": "সুরট",
    "taal": "মল্লার—ঝাঁপতাল",
    "composer": "প্রচলিত",
    "lyrics": "অন্তরে জাগিছ গো মা, অন্তরযামিনী,\nকোলে করে আছ মোরে, দিবস-যামিনী ।।\nঅধম সুতের প্রতি কেন এত স্নেহপ্রীতি,\nপ্রেমে আহা একেবারে যেন পাগলিনী ।।\nকখনো আদর করি, কখনো সবলে ধরি,\nপিয়াও অমৃত শুনাও মধুর কাহিনী;\nনিরবধি অবিচারে, কত ভালোবাস মোরে,\nউদ্ধারিছ বারে বারে পতিতোদ্ধারিনি ।।\nবুঝেছি এবার সার, মা আমার আমি মার,\nচলিব সুপথে সদা শুনি তব বাণী;\nকরি মাতৃস্তন্য পান, হব বীর বলবান,\nআনন্দে গাইব তব ব্রহ্মসনাতনী ।।\n[https://youtu.be/SrjJGOlowI4?si=1zypEkjZpfiZtVei](https://youtu.be/SrjJGOlowI4?si=1zypEkjZpfiZtVei)"
  },
  {
    "id": "song-3",

    "taal": "ঝাঁপতাল",
    "composer": "রামপ্রসাদ",
    "lyrics": "অভয়-পদে প্রাণ সঁপেছি ।\nআমি আর কি যমের ভয় রেখেছি ।।\nকালী নাম কল্পতরু, হৃদয়ে রোপণ করেছি ।\nএ দেহ বেচে ভবের হাটে দুর্গানাম কিনে এনেছি ।।\nদেহের মধ্যে সুজন যে জন তাঁর ঘরেতে ঘর করেছি ।\nএবার শমন এলে হৃদয় খুলে দেখাব ভেবে রেখেছি ।।\nসারাৎসার তারা নাম আপন শিখাগ্রে রেখেছি ।\nরামপ্রসাদ বলে দুর্গা ব’লে, যাত্রা করে বসে আছি ।।"
  },
  {
    "id": "song-4",
    "title": "অভয়ার অভয়পদ কর মন সার",
    "raag": "গৌড়সারঙ্গ",
    "taal": "ঝাঁপতাল",
    "composer": "প্রচলিত",

  },
  {
    "id": "song-5",
    "title": "আমরা মায়ের ছেলে, আমরা মায়ের ছেলে",
    "raag": "ইমন",
    "taal": "কল্যাণ—খেমটা",
    "composer": "প্রচলিত",
    "lyrics": "আমরা মায়ের ছেলে, আমরা মায়ের ছেলে।\nআমরা কি কম, আসুক না যম, জিনব অবহেলে ।।\nপথের’পরে বিপদ এলে, দলতে পারি পদতলে।\n(মোদের) হুঙ্কারেতে সাগর শুকায়, পাহাড় পড়ে ট’লে ।।\nচন্দ্র সূর্য গ্রহতারা, মায়ের কথায় ঘুরছে তারা।\nএমন মায়ের ছেলে মোরা দুর্বল কে বলে ।।\nমোদের আবার পাপ কোথায়, স্বর্গ নরক কে বল চায়?\nকাজ ফুরালে সন্ধ্যাবেলায় মা করিবে কোলে ।।"
  },
  {
    "id": "song-6",
    "title": "আমার মা ত্বং হি তারা",
    "raag": "ভৈরবী",

    "composer": "প্রচলিত",
    "lyrics": "আমার মা ত্বং হি তারা, তুমি ত্রিগুণধরা পরাৎপরা ।\nআমি জানি মা ও দীনদয়াময়ী, তুমি দুর্গমেতে দুখহরা ।।\nতুমি জলে তুমি স্থলে, তুমি আদিমূলে গো মা,\nআছ সর্বঘটে অক্ষপুটে, সাকার আকার নিরাকারা ।।\nতুমি সন্ধ্যা তুমি গায়ত্রী, তুমি জগদ্ধাত্রী গো মা,\nতুমি অকূলের ত্রাণকর্ত্রী, সদা শিবের মনোহরা ।।"
  },
  {
    "id": "song-7",
    "title": "আমার মাকে কি দেখেছিস্ তোরা",
    "raag": "জংলা",
    "taal": "দাদরা",
    "composer": "প্রচলিত",
    "lyrics": "আমার মাকে কি দেখেছিস্ তোরা বল্ সত্যি ক'রে ।\nমায়ের নব নব নবরূপে ভুবন মন হরে ।।\nমা তো আমার নয় রে কল্পনা ঐ দেখ্ চিন্ময়ী হাস্যবদনা,\nমায়ের স্নেহ-চক্ষে প্রেমবক্ষে অমিয় ঝরে ।।\nহাসিমুখে করে ভুবন আলো, মায়ের কোলে শোভে ভক্তদল,\nমায়ের প্রসারিত প্রেমবাহু আমাদের তরে ।।\nআয় রে আয় ও জগৎবাসী, তোরা দেখে যা একবার আসি,\nমোদের জননীর ও রূপরাশি পরাণ ভরে ।\n(ও রূপ) যে দেখেছে সেই মজেছে জনমের তরে ।।"
  },
  {
    "id": "song-8",

    "raag": "ছায়ানট",

  {
    "id": "song-28",
    "title": "ত্বং অপারা, বিশ্বসারা",

    "taal": "চৌতাল",
    "composer": "প্রচলিত",
    "lyrics": "ত্বং অপারা, বিশ্বসারা, বিশ্বধারা বিশ্বরঞ্জিনী;\nসর্বভূত-আত্মভূত, সর্বাবিভূতি-প্রবিধায়িনী ।।\nত্বং অনল-ক্ষিতি-অনিল, ব্যোম-সলিল-সংরূপিণী;\nতুমি অমেয়া মহেশজায়া, ভো অভয়া ভয়বারিণী ।।\nবিরাজিতা শব-আসনে, কভু প্রমত্তা আসব পানে,\nকভু যুক্তা শিব সনে, শিবে গো শিবাপি;\nওমা ত্রিগুণধারিণি, গুণাতীতা ত্রিনয়নি,\nপ্রেমিকের ত্রিতাপের তাপ সংহর হর-মোহিনী।।\nWord meaning\nত্বং অপারা : \"You are limitless/infinite.\" She is beyond all boundaries of time, space, and comprehension.\nবিশ্বসারা : \"You are the essence of the universe.\"\nবিশ্বধারা : \"You are the sustainer of the universe.\"\nবিশ্বরঞ্জিনী : \"You are the one who colors/delights the universe.\"\nসর্বভূত-আত্মভূত : \"You are the soul (Atman) within all beings.\"\nসর্বাবিভূতি-প্রবিধায়িনী : \"You are the giver of all divine powers and manifestations.\"\nঅনল-ক্ষিতি-অনিল, ব্যোম-সলিল-সংরূপিণী : She is the embodiment of the Pancha Mahabhuta, the five great elements that constitute all physical creation.\nঅমেয়া: \"You are immeasurable.\"\nমহেশজায়া: \"The consort of Mahesha (Shiva).\" This identifies her as Shakti, the dynamic feminine energy, united with Shiva, the static pure consciousness.\nঅভয়া ভয়বারিণী: \"The fearless one and the remover of fear.\"\nবিরাজিতা শব-আসনে : \"Seated upon a corpse.\" This is the iconic image of Goddess Kali. The śaba (corpse) is Shiva, representing pure, inert consciousness. She, as active energy (Shakti), is the power that animates the universe. It signifies that she is the supreme power, transcendent even over death.\nপ্রমত্তা আসব পানে (Pramattā āsaba pānē): \"Ecstatic from drinking wine (āsaba).\" This is symbolic. The \"wine\" is the intoxicating bliss of divine consciousness. It represents her wild, untamed nature that breaks free from all worldly conventions.\nত্রিগুণধারিণি, গুণাতীতা (Triguṇadhāriṇī, Guṇātītā): \"The bearer of the three Gunas, yet beyond the Gunas.\" This is a core philosophical concept. She manifests and manages the entire creation through the three modes of nature (Sattva - purity, Rajas - action, Tamas - inertia), yet her true self is transcendent and untouched by them.\nপ্রেমিকের ত্রিতাপের তাপ সংহর (Prēmikēra tritāpēra tāpa saṁhara): This is the devotee's prayer. The tritāpa are the three great miseries of existence:\nĀdhyātmika: Sufferings arising from one's own body and mind (illness, anxiety).\nĀdhibhautika: Sufferings caused by other beings (enemies, wild animals).\nĀdhidaivika: Sufferings from supernatural or natural forces (floods, famines, fate).The devotee (prēmik, literally \"the lover\") asks her to destroy this burning pain.\nহর-মোহিনী (Hara-mōhinī): \"She who enchants/captivates Hara (Shiva).\" This is the ultimate statement of her power. She is the supreme enchantress whose divine play and charm captivate even the ultimate ascetic, Lord Shiva. The devotee appeals to this power, believing that if she can enchant the Lord of the Universe, she can surely relieve the suffering of a humble devotee."

    "lyrics": "বামা কেরে এলো-চিকুরে!\nবিহরে আনন্দময়ী শব-হৃদিপরে ॥\nবসন নাহিক গায়,পদ্নগন্ধে অলি ধায়;\nচলে যেতে চলে পড়ে আসব-ভরে ॥\nযে ঠেঁকেছে রাঙা পায়,হত-দিতি-সুতচয়\nস্পর্শমাত্র শিব হয় সমর-মাঝারে ॥\nকমলাকান্তের ভাষী, সর্বনাশী, ধরে অসি;\nকরিলি সব কাশীবাসী জনমের তরে ॥\nStanza 1: The Identity and Posture\nবামা কেরে এলো-চিকুরে!\nবিহরে আনন্দময়ী শব-হৃদিপরে ॥\n\"Who is this Bāmā (Goddess) with disheveled hair?\" The Bāmā (Goddess) appears with her long, black hair loose and wild (এলো-চিকুরে), symbolizing her untamed nature and freedom from social restrictions. The inquiry (কেরে) expresses awe at this sudden, fierce appearance.\n\"The Blissful Mother (Anandamayī) sports upon the heart of the corpse.\" She is simultaneously the Blissful Mother (আনন্দময়ী) and the one who stands on the inert body of Lord Shiva (শব-হৃদিপরে).\nThis is a central philosophical statement: the Supreme Consciousness (Shiva, the corpse) is lifeless without the dynamic power of the Goddess (Kāli, the dancer).\nStanza 2: The Paradox of Purity and Intoxication\nবসন নাহিক গায়,পদ্নগন্ধে অলি ধায়;\nচলে যেতে চলে পড়ে আসব-ভরে ॥\nThis stanza highlights the paradox of Kāli's appearance, contrasting her terrifying nudity with her spiritual essence and ecstasy.\n\"She has no clothes on her body, yet bees rush towards the scent of the lotus.\" Her nudity (বসন নাহিক গায়) symbolizes her being unconstrained by illusion (Maya) or the covering of the material world.\nDespite her fierce form, her spiritual essence is so pure that a sweet, spiritual fragrance (like পদ্নগন্ধে or lotus scent) attracts devotees (like the অলি or bees).\n\"While walking, she stumbles and falls, full of intoxication.\" This intoxication (আসব-ভরে) is not from alcohol, but from her overwhelming divine ecstasy—the bliss of annihilating ignorance and ego. Her stumbling suggests the sheer, uncontrollable power of this spiritual frenzy.\nStanza 3: The Power of Transformation and Grace\nযে ঠেঁকেছে রাঙা পায়,হত-দিতি-সুতচয়\nস্পর্শমাত্র শিব হয় সমর-মাঝারে ॥\nThis stanza describes Kāli's power to grant ultimate liberation, even to her enemies.\n\"The multitude of slain sons of Diti (demons)—whoever merely touched her ruddy feet—became Shiva in the midst of the battle.\" The sons of Diti (দিতি-সুতচয়) are the demons, representing the spiritual enemies (vices and ego). The poet describes the incredible grace of the Mother: the moment the slain demons touch her red, sacred feet (রাঙা পায়), they are instantly transformed and achieve the state of Shiva (শিব হয়). This means her destruction is not punishment, but the ultimate act of Moksha (liberation).\nStanza 4: The Poet's Declaration and Final Verdict\nকমলাকান্তের ভাষী, সর্বনাশী, ধরে অসি;\nকরিলি সব কাশীবাসী জনমের তরে ॥\nThis is the concluding stanza, where the composer, Kamalakānta, offers his final realization of Kāli's ultimate benevolent role.\n\"Kamalakānta says, 'You, the Destroyer of everything, who wields the sword...'\" The composer, Kamalakānta (কমলাকান্তের ভাষী), addresses the Goddess using the epithet সর্বনাশী (\"Destroyer of all\"). By destroying \"everything,\" she removes the illusory boundaries that keep the soul separate from the divine.\"...You have made everyone a resident of Kashi forever.\" To be a resident of Kashi (কাশীবাসী) means to attain final salvation, as the city of Varanasi is believed to grant liberation upon death. The poet realizes that Kāli's destructive power is entirely merciful; by destroying the ego with her sword (অসি), she guarantees eternal liberation (জনমের তরে) for all beings.\n1. হত-দিতি-সুতচয় - refers to the slaying of the sons of Diti (the demons).\n2. বিহরে আনন্দময়ী শব-হৃদিপরে - Standing on the chest of Lord Shiva (who lies inert as a corpse - শব), she demonstrates her supremacy as Śakti (Energy), proving that without her, Śiva (Consciousness) is motionless and powerless.\n3. The Annihilation of Ego (সর্বনাশী): The epithet সর্বনাশী (sarbanāśī - \"Destroyer of everything\") is a spiritual compliment. Kāli does not destroy the world; she destroys the illusion and the Ego (Ahaṃkāra) that binds the devotee. She \"ruins\" the finite self to reveal the infinite Self.\n4. Her disheveled hair (এলো-চিকুরে) and her stumbling from intoxication (আসব-ভরে) symbolize her state of complete divine ecstasy (Bhāva). She operates beyond social laws and religious restrictions, embodying the freedom of the Tantric (Vāmācāra) path."

    "taal": "একতাল",
    "composer": "প্রচলিত",
    "lyrics": "হের হর-মনোমোহিনী কে বলে রে কাল মেয়ে।\n(আমার) মায়ের রূপে ভুবন আলো, চোখ থাকে তো দেখনা চেয়ে ।।\nবিমল হাসি ক্ষরে শশী, অরুণ পড়ে নখে খসি,\nএলোকেশী শ্যামা ষোড়শী;\nকমলভ্রমে ভ্রমর ভ্রমে, বিভোর ভোলা চরণ পেয়ে ।।"
  }
];

    let currentFilter = { raag: "", taal: "", search: "" };

    function initPage() {
      populateDropdowns();
      renderApp();
    }

    function populateDropdowns() {
      const raags = [...new Set(songs.map(s => s.raag).filter(r => r !== "অনির্দিষ্ট"))].sort();
      const taals = [...new Set(songs.map(s => s.taal).filter(t => t !== "অনির্দিষ্ট"))].sort();

      const raagSelect = document.getElementById("raag-filter");
      const taalSelect = document.getElementById("taal-filter");

      raags.forEach(r => raagSelect.innerHTML += `<option value="${r}">${r}</option>`);
      taals.forEach(t => taalSelect.innerHTML += `<option value="${t}">${t}</option>`);
    }

    function renderApp() {
      const container = document.getElementById("song-container");
      const navList = document.getElementById("nav-list");
      container.innerHTML = "";
      navList.innerHTML = "";

      const filtered = songs.filter(song => {
        const matchesRaag = !currentFilter.raag || song.raag === currentFilter.raag;
        const matchesTaal = !currentFilter.taal || song.taal === currentFilter.taal;
        const q = currentFilter.search.toLowerCase();
        const matchesSearch = !q || 
                              song.title.toLowerCase().includes(q) || 
                              song.raag.toLowerCase().includes(q) || 
                              song.taal.toLowerCase().includes(q) || 
                              song.composer.toLowerCase().includes(q) ||
                              song.lyrics.toLowerCase().includes(q);
        return matchesRaag && matchesTaal && matchesSearch;
      });

      document.getElementById("song-count").innerText = `${filtered.length}টি গান`;

      filtered.forEach((song) => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="#${song.id}">${song.title}</a>`;
        navList.appendChild(li);

        const card = document.createElement("article");
        card.className = "song-card";
        card.id = song.id;
        card.innerHTML = `
          <div class="song-header">
            <h3 class="song-title">${song.title}</h3>
            <div class="song-meta-tags">
              <span class="tag tag-raag" onclick="filterByTag('raag', '${song.raag}')">রাগ: ${song.raag}</span>
              <span class="tag tag-taal" onclick="filterByTag('taal', '${song.taal}')">তাল: ${song.taal}</span>
              <span class="tag tag-composer">${song.composer}</span>
            </div>
          </div>
          <div class="lyrics">${song.lyrics}</div>
          <div class="card-footer">
            <a href="#sidebar" class="top-link">↑ সূচিপত্রে ফিরে যান</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterByTag(type, value) {
      if (type === 'raag') {
        currentFilter.raag = value;
        document.getElementById("raag-filter").value = value;
      } else if (type === 'taal') {
        currentFilter.taal = value;
        document.getElementById("taal-filter").value = value;
      }
      renderApp();
    }

    function filterByDropdown() {
      currentFilter.raag = document.getElementById("raag-filter").value;
      currentFilter.taal = document.getElementById("taal-filter").value;
      renderApp();
    }

    function handleSearch(val) {
      currentFilter.search = val;
      renderApp();
    }

    function resetFilters() {
      currentFilter = { raag: "", taal: "", search: "" };
      document.getElementById("raag-filter").value = "";
      document.getElementById("taal-filter").value = "";
      document.getElementById("sidebar-search").value = "";
      renderApp();
    }

    window.onload = initPage;
  </script>
</body>
</html>
